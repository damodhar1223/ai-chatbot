<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verify OTP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: #16213e;
      padding: 40px;
      border-radius: 16px;
      width: 380px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .logo {
      text-align: center;
      font-size: 40px;
      margin-bottom: 8px;
    }
    h2 {
      text-align: center;
      color: white;
      font-size: 22px;
      margin-bottom: 4px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .email-show {
      text-align: center;
      color: #6c47ff;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .otp-input {
      width: 100%;
      padding: 16px;
      background: #1a1a2e;
      border: 2px solid #0f3460;
      border-radius: 8px;
      color: white;
      font-size: 28px;
      text-align: center;
      letter-spacing: 12px;
      outline: none;
      margin-bottom: 16px;
    }
    .otp-input:focus { border-color: #6c47ff; }
    .btn {
      width: 100%;
      padding: 12px;
      background: #6c47ff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #5535dd; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error {
      background: rgba(255,71,87,0.15);
      color: #ff4757;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      text-align: center;
    }
    .link {
      text-align: center;
      margin-top: 16px;
      color: #666;
      font-size: 13px;
    }
    .link a {
      color: #6c47ff;
      text-decoration: none;
    }
    .resend {
      text-align: center;
      margin-top: 12px;
      color: #666;
      font-size: 13px;
    }
    .resend a {
      color: #aaa;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">📬</div>
    <h2>Enter OTP</h2>
    <p class="subtitle">OTP sent to:</p>
    <p class="email-show" id="emailShow"></p>

    <div class="error" id="errorMsg"></div>

    <input
      type="text"
      class="otp-input"
      id="otpInput"
      placeholder="------"
      maxlength="6"
    />

    <button class="btn" id="verifyBtn"
      onclick="verifyOTP()">
      ✅ Verify OTP
    </button>

    <div class="resend">
      Didn't receive OTP?
      <a href="/forgot-password">Resend OTP</a>
    </div>

    <div class="link">
      <a href="/login">← Back to Login</a>
    </div>
  </div>

  <script>
    // Get email from URL
    const urlParams =
      new URLSearchParams(window.location.search);
    const email = urlParams.get("email") || "";
    document.getElementById("emailShow")
      .textContent = email;

    document.getElementById("otpInput")
      .addEventListener("keypress", e => {
        if (e.key === "Enter") verifyOTP();
      });

    async function verifyOTP() {
      const otp =
        document.getElementById("otpInput")
        .value.trim();
      const errorMsg =
        document.getElementById("errorMsg");
      const btn =
        document.getElementById("verifyBtn");

      errorMsg.style.display = "none";

      if (otp.length !== 6) {
        errorMsg.textContent =
          "Please enter the 6-digit OTP!";
        errorMsg.style.display = "block";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Verifying...";

      const res = await fetch("/verify-otp", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email, otp })
      });

      const data = await res.json();

      if (data.success) {
        window.location.href = "/reset-password";
      } else {
        errorMsg.textContent = data.error;
        errorMsg.style.display = "block";
        btn.disabled = false;
        btn.textContent = "✅ Verify OTP";
      }
    }
  </script>
</body>
</html>
