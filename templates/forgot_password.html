<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: #16213e;
      padding: 40px;
      border-radius: 16px;
      width: 380px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .logo {
      text-align: center;
      font-size: 40px;
      margin-bottom: 8px;
    }
    h2 {
      text-align: center;
      color: white;
      font-size: 22px;
      margin-bottom: 4px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      font-size: 13px;
      margin-bottom: 28px;
    }
    .input-group { margin-bottom: 16px; }
    label {
      display: block;
      color: #aaa;
      font-size: 13px;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      background: #1a1a2e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #6c47ff; }
    .btn {
      width: 100%;
      padding: 12px;
      background: #6c47ff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn:hover { background: #5535dd; }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .error {
      background: rgba(255,71,87,0.15);
      color: #ff4757;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      text-align: center;
    }
    .success {
      background: rgba(46,213,115,0.15);
      color: #2ed573;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      text-align: center;
    }
    .link {
      text-align: center;
      margin-top: 20px;
      color: #666;
      font-size: 13px;
    }
    .link a {
      color: #6c47ff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🔐</div>
    <h2>Forgot Password?</h2>
    <p class="subtitle">
      Enter your email to receive an OTP
    </p>

    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>

    <div class="input-group">
      <label>Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="your@gmail.com"
      />
    </div>

    <button class="btn" id="sendBtn"
      onclick="sendOTP()">
      📧 Send OTP
    </button>

    <div class="link">
      Remember password?
      <a href="/login">Login here</a>
    </div>
  </div>

  <script>
    document.addEventListener("keypress", e => {
      if (e.key === "Enter") sendOTP();
    });

    async function sendOTP() {
      const email =
        document.getElementById("email").value.trim();
      const errorMsg =
        document.getElementById("errorMsg");
      const successMsg =
        document.getElementById("successMsg");
      const btn =
        document.getElementById("sendBtn");

      errorMsg.style.display = "none";
      successMsg.style.display = "none";

      if (!email) {
        errorMsg.textContent =
          "Please enter your email!";
        errorMsg.style.display = "block";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Sending OTP...";

      const res = await fetch("/forgot-password", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email })
      });

      const data = await res.json();

      if (data.success) {
        successMsg.textContent =
          "✅ OTP sent to your email! Check inbox.";
        successMsg.style.display = "block";
        btn.textContent = "OTP Sent! ✅";

        // Redirect to verify OTP page
        setTimeout(() => {
          window.location.href =
            `/verify-otp?email=${email}`;
        }, 2000);
      } else {
        errorMsg.textContent = data.error;
        errorMsg.style.display = "block";
        btn.disabled = false;
        btn.textContent = "📧 Send OTP";
      }
    }
  </script>
</body>
</html>
