<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - AI Chatbot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: #16213e;
      padding: 40px;
      border-radius: 16px;
      width: 380px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .logo {
      text-align: center;
      font-size: 40px;
      margin-bottom: 8px;
    }

    h2 {
      text-align: center;
      color: white;
      margin-bottom: 8px;
      font-size: 22px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 13px;
      margin-bottom: 28px;
    }

    .input-group { margin-bottom: 16px; }

    label {
      display: block;
      color: #aaa;
      font-size: 13px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background: #1a1a2e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      outline: none;
    }

    input:focus { border-color: #6c47ff; }

    .btn {
      width: 100%;
      padding: 12px;
      background: #6c47ff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn:hover { background: #5535dd; }

    .error {
      background: #ff475720;
      color: #ff4757;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      text-align: center;
    }

    .success {
      background: #2ed57320;
      color: #2ed573;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      text-align: center;
    }

    .link {
      text-align: center;
      margin-top: 20px;
      color: #666;
      font-size: 13px;
    }

    .link a {
      color: #6c47ff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🤖</div>
    <h2>Create Account</h2>
    <p class="subtitle">Join AI Chatbot for free</p>

    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>

    <div class="input-group">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Your name"/>
    </div>

    <div class="input-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="you@gmail.com"/>
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Create a password"/>
    </div>

    <button class="btn" onclick="register()">Create Account</button>

    <div class="link">
      Already have an account?
      <a href="/login">Login here</a>
    </div>
  </div>

  <script>
    document.addEventListener("keypress", (e) => {
      if (e.key === "Enter") register();
    });

    async function register() {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorMsg = document.getElementById("errorMsg");
      const successMsg = document.getElementById("successMsg");

      errorMsg.style.display = "none";
      successMsg.style.display = "none";

      if (!name || !email || !password) {
        errorMsg.textContent = "Please fill in all fields!";
        errorMsg.style.display = "block";
        return;
      }

      if (password.length < 6) {
        errorMsg.textContent = "Password must be at least 6 characters!";
        errorMsg.style.display = "block";
        return;
      }

      const response = await fetch("/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, password })
      });

      const data = await response.json();

      if (data.success) {
        successMsg.textContent = "Account created! Redirecting...";
        successMsg.style.display = "block";
        setTimeout(() => {
          window.location.href = "/chat-page";
        }, 1500);
      } else {
        errorMsg.textContent = data.error;
        errorMsg.style.display = "block";
      }
    }
  </script>
</body>
</html>
